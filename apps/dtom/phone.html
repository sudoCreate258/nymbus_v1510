<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nymbus · Phone camera</title>
<style>
  body{margin:0;font:16px/1.45 system-ui,sans-serif;color:#eef3ee;background:#0e1711;min-height:100vh}
  main{padding:16px;max-width:520px;margin:0 auto}
  h1{font-size:18px;margin:0 0 4px} .muted{color:#a9b8ad;font-size:13px}
  input,select,button{font:inherit;color:#eef3ee;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px}
  input{letter-spacing:.3em;font-size:24px;width:9ch;text-align:center}
  button.primary{background:#6cc94a;color:#0b1408;border:0;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .stage{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:12px;overflow:hidden}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .status{margin:10px 0;font-size:14px} .ok{color:#7ed957} .bad{color:#ff6b6b} .warn{color:#ffb347}
</style>
</head>
<body>
<main>
  <h1>Phone camera for the twin</h1>
  <div class="muted">Pose tracking runs on this phone. Only joint positions are sent to your PC — no video.</div>
  <div class="row">
    <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="Pairing code">
    <select id="facing"><option value="environment">Rear camera (sharper)</option><option value="user">Front camera</option></select>
  </div>
  <div class="row">
    <button id="go" class="primary">Pair &amp; start</button>
    <button id="stop" disabled>Stop</button>
    <label class="muted"><input type="checkbox" id="preview" checked style="width:auto"> show preview</label>
  </div>
  <div class="status" id="status">Enter the 6-digit code shown on the PC.</div>
  <div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
  <p class="muted">Prop the phone at the side of the room at chest height, about 1.5–2 m from your chair. Keep it charging.</p>
</main>
<script type="module">
const $=id=>document.getElementById(id), v=$('v'), c=$('c'), g=c.getContext('2d');
let stream=null, lm=null, running=false, lastSend=0, sent=0, fails=0, wake=null;
const code=()=>$('code').value.trim();
function status(t,cls=''){const s=$('status');s.textContent=t;s.className='status '+cls;}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code(),...body})});return r;}
async function start(){
  if(!/^\d{6}$/.test(code())){status('Enter the 6-digit code from the PC.','bad');return;}
  $('go').disabled=true;
  try{
    const r=await post('/api/pair',{}); if(!r.ok){status('Pairing refused — check the code on the PC.','bad');$('go').disabled=false;return;}
    status('Paired. Starting camera…','ok');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:$('facing').value,width:{ideal:1280},height:{ideal:960}},audio:false});
    v.srcObject=stream; await v.play();
    status('Loading pose model…');
    const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    lm=await vision.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1});
    try{wake=await navigator.wakeLock?.request('screen');}catch(e){}
    running=true; $('stop').disabled=false; status('Streaming joints to the PC.','ok'); requestAnimationFrame(loop);
  }catch(e){status('Could not start: '+e.message,'bad');$('go').disabled=false;}
}
function stop(){running=false;stream?.getTracks().forEach(t=>t.stop());wake?.release?.();$('go').disabled=false;$('stop').disabled=true;status('Stopped.');}
let lastTs=-1;
async function loop(){
  if(!running)return;
  const now=performance.now();
  if(v.videoWidth&&now!==lastTs){
    lastTs=now; const r=lm.detectForVideo(v,now);
    c.width=v.videoWidth;c.height=v.videoHeight;g.clearRect(0,0,c.width,c.height);
    v.style.opacity=$('preview').checked?1:0;
    const L=r.landmarks?.[0], W=r.worldLandmarks?.[0];
    if(L){
      g.fillStyle='#7ed957';for(const p of L){if((p.visibility??1)<.5)continue;g.beginPath();g.arc(p.x*c.width,p.y*c.height,6,0,7);g.fill();}
      if(now-lastSend>100){
        lastSend=now;
        post('/api/landmarks',{facing:$('facing').value,
          world:W.map(p=>[+p.x.toFixed(4),+p.y.toFixed(4),+p.z.toFixed(4)]),
          img:L.map(p=>[+p.x.toFixed(4),+p.y.toFixed(4),+p.z.toFixed(4),+(p.visibility??1).toFixed(3)])})
        .then(r=>{if(r.ok){sent++;fails=0;if(sent%20===0)status(`Streaming joints to the PC · ${sent} updates sent`,'ok');}else{fails++;status('PC refused data ('+r.status+') — re-check the code.','bad');}})
        .catch(()=>{fails++;if(fails>5)status('Lost connection to the PC — same Wi-Fi? server still running?','warn');});
      }
    }
  }
  requestAnimationFrame(loop);
}
$('go').onclick=start;$('stop').onclick=stop;
if(!window.isSecureContext)status('Open this page with https:// (the address shown on the PC).','bad');
</script>
</body>
</html>
